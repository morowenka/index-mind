version: '3.8'

services:
  init:
    image: busybox
    container_name: indexmind-init
    command: sh -c "echo 'Testing network...' && ping -c 3 backend && echo 'Network test completed'"
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - indexmind-network
    restart: "no"

  backend:
    image: indexmind-backend:good
    container_name: indexmind-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - indexmind-network

  postgres:
    image: postgres:15
    container_name: indexmind-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    env_file: .env
    networks:
      - indexmind-network

networks:
  indexmind-network:
    driver: bridge

volumes:
  backend_data:
    name: indexmind-backend-data
  postgres_data:
    name: indexmind-postgres-data
